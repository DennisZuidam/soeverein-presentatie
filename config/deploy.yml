# Kamal 2 · env-gedreven config voor de terminal-demo.
#
# Het IP dat az/scw teruggeeft landt via ENV live in deze config, zodat je
# nergens handmatig een IP hoeft te plakken. Kies je cloud met -d:
#
#   kamal setup  -d azure      # de "voor"-situatie  (Microsoft)
#   kamal setup  -d scaleway   # de "na"-situatie    (nl-ams)
#   kamal deploy -d hetzner    # nog een provider = één vlag
#
# Zet vóór elke deploy in je shell:
#   export DEPLOY_IP=<ip>                          # komt uit az/scw
#   export DEPLOY_HOST=<ip-met-streepjes>.sslip.io
#   export KAMAL_REGISTRY_PASSWORD=<ghcr-token>    # blijft buiten beeld
service: euwest1-presentatie
image: denniszuidam/soeverein-presentatie

servers:
  web:
    - <%= ENV.fetch("DEPLOY_IP") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("DEPLOY_HOST") %>
  healthcheck:
    path: /

registry:
  server: ghcr.io
  username: denniszuidam
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
